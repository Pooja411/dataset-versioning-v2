<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>datavault</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<style>
:root{--bg:#0d1117;--bg2:#161b22;--bg3:#21262d;--border:#30363d;--text:#e6edf3;--muted:#9da7b3;--accent:#58a6ff;--green:#3fb950;--red:#f85149;--yellow:#e3b341;--purple:#bc8cff;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
@media (prefers-color-scheme:light){:root{--bg:#fff;--bg2:#f6f8fa;--bg3:#eaeef2;--border:#d0d7de;--text:#1f2328;--muted:#57606a;--accent:#0969da;--green:#1a7f37;--red:#cf222e;--yellow:#9a6700;--purple:#8250df}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,sans-serif;height:100vh;display:flex;flex-direction:column}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:8px 14px;background:var(--bg2);border-bottom:1px solid var(--border)}
header h1{font-size:15px;margin:0;font-family:var(--mono)}
input,select,button{background:var(--bg3);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:5px 9px;font:inherit}
button{cursor:pointer}button:hover{border-color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{flex:1;display:grid;grid-template-columns:minmax(0,1.4fr) minmax(320px,1fr);min-height:0}
#graph-wrap{position:relative;border-right:1px solid var(--border);min-height:0}
#graph{width:100%;height:100%;display:block}
aside{display:flex;flex-direction:column;min-height:0}
#tabs{display:flex;border-bottom:1px solid var(--border);background:var(--bg2)}
#tabs button{border:0;border-bottom:2px solid transparent;border-radius:0;background:none;padding:8px 12px}
#tabs button[aria-selected=true]{border-bottom-color:var(--accent);color:var(--accent)}
#panel{flex:1;overflow:auto;padding:12px 14px}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:16px 0 6px}
h2:first-child{margin-top:0}
.mono{font-family:var(--mono);font-size:12px;word-break:break-all}
.muted{color:var(--muted)}
.badge{display:inline-block;border:1px solid var(--border);border-radius:10px;padding:0 7px;font-size:11px;margin-right:4px}
.ok{color:var(--green)}.bad{color:var(--red)}.warn{color:var(--yellow)}.hyp{color:var(--purple)}
table{border-collapse:collapse;width:100%;font-size:12px}td,th{border-bottom:1px solid var(--border);padding:3px 6px;text-align:left;vertical-align:top}
ul{padding-left:18px;margin:4px 0}
.state{padding:24px;text-align:center;color:var(--muted)}
.node{cursor:pointer}.node:focus-visible circle,.node:focus-visible rect{stroke:var(--accent);stroke-width:3}
.node.dim{opacity:.18}.node.sel circle,.node.sel rect{stroke:var(--accent);stroke-width:3}.node.cmp circle,.node.cmp rect{stroke:var(--yellow);stroke-width:3}
.edge{fill:none;stroke:var(--border);stroke-width:1.6}.edge.experiment{stroke-dasharray:3 3}.edge.rerun{stroke:var(--purple)}
.lbl{fill:var(--text);font:11px var(--mono);pointer-events:none}.sub{fill:var(--muted);font:10px var(--mono);pointer-events:none}
.sr{position:absolute;left:-9999px}
a.ev{color:var(--accent);cursor:pointer;text-decoration:underline;background:none;border:0;padding:0;font:inherit}
@media (max-width:900px){main{grid-template-columns:1fr;grid-template-rows:50vh 1fr}#graph-wrap{border-right:0;border-bottom:1px solid var(--border)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <h1>datavault</h1>
  <span id="head" class="muted mono"></span>
  <label class="sr" for="q">Search</label>
  <input id="q" type="search" placeholder="search id, message, tag, branch" size="28">
  <label class="sr" for="branch">Branch</label>
  <select id="branch"><option value="">all branches</option></select>
  <label><input id="showExp" type="checkbox" checked> experiments</label>
  <label class="sr" for="status">Experiment status</label>
  <select id="status"><option value="">any status</option><option>completed</option><option>failed</option></select>
  <button id="verify">Verify integrity</button>
  <span id="live" class="sr" role="status" aria-live="polite"></span>
</header>
<main>
  <div id="graph-wrap">
    <svg id="graph" role="group" aria-label="Dataset lineage graph"></svg>
    <div id="graph-state" class="state" hidden></div>
  </div>
  <aside>
    <div id="tabs" role="tablist" aria-label="Details">
      <button role="tab" data-tab="detail" aria-selected="true">Details</button>
      <button role="tab" data-tab="compare" aria-selected="false">Compare</button>
      <button role="tab" data-tab="metrics" aria-selected="false">Metrics</button>
      <button role="tab" data-tab="ai" aria-selected="false">AI</button>
      <button role="tab" data-tab="list" aria-selected="false">List</button>
    </div>
    <div id="panel" role="tabpanel" tabindex="0"></div>
  </aside>
</main>
<script src="/app.js"></script>
</body>
</html>
